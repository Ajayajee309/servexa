server.port=8088

spring.application.name=backend

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/servexa_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:ajay@2007}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
servexa.app.jwtSecret=${JWT_SECRET:ServexaSecretKeyForJwtAuthenticationWhichMustBeLongEnoughToWorkWithHS256Algorithm}
servexa.app.jwtExpirationMs=86400000

# File Upload Configuration (for later)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
